<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="index.html">
    <div class="grainient-bg" id="grainientBg"></div>
    <div class="main-content index-page">
        <div class="index-center">
            <div class="index-logo">UNI<span>CITY</span></div>
            <p class="index-tagline">Prove you're real. Know your risk.</p>
            <p class="index-desc">Privacy-preserving identity verification with AI-powered Sybil risk intelligence.</p>
            <div class="index-buttons">
                <button class="btn-index-primary" onclick="navigateTo('verify.html')">Get Started</button>
                <button class="btn-index-secondary" onclick="navigateTo('dashboard.html')">View Demo</button>
            </div>
        </div>
    </div>
    <div class="demo-badge">DEMO MODE</div>
    <script src="js/api.js"></script>
    <script src="js/grainient.js"></script>
    <script src="js/app.js"></script>
    <script>
        initGrainient("grainientBg", {
            color1: "#1bc5b3",
            color2: "#171817",
            color3: "#159A8C",
            timeSpeed: 0.12,
            warpStrength: 1.0,
            warpFrequency: 5.0,
            warpSpeed: 1.5,
            warpAmplitude: 50.0,
            blendAngle: 0.0,
            blendSoftness: 0.05,
            rotationAmount: 500.0,
            noiseScale: 2.0,
            grainAmount: 0.06,
            grainScale: 2.0,
            contrast: 1.5,
            gamma: 0.95,
            saturation: 1.2,
            centerX: 0.0,
            centerY: 0.0,
            zoom: 0.85
        });
    </script>
</body>
</html>
