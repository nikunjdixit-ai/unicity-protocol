[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "npm install",
  "cd backend && npm install",
  "cd ../x402 && npm install"
]

[phases.build]
cmds = [
  "cd x402 && npm run build"
]

[start]
cmd = "node backend/server.js"
